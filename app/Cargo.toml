[package]
name = "audio-converter"
version = "1.0.1"
edition = "2024"
description = "Audio converter"
license = "MIT"

# Identity that is not a standard Cargo field. build.rs turns it into compile-time constants, so
# the source carries no literal name (the analogue of reading package.json's productName).
[package.metadata.yaiol]
product-name = "Audio Converter"

[dependencies]
base64 = "0.23.1"
dioxus = { version = "0.7.10", features = ["desktop"] }
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }
dirs = "7.0.0"
engine = { package = "audio-converter-engine", path = "../engine" }
notify-rust = "4.18.2"
num_cpus = "1.17.0"
open = "5.4.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "time"] }
ureq = { version = "3.4.2", features = ["json"] }

[build-dependencies]
toml = "1.1.8"
